services:
  gateway:
    image: ${IMAGE_REPOSITORY:-ghcr.io/owner/jove-gateway}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r=await fetch('http://localhost:3000/health');if(!r.ok)process.exit(1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
