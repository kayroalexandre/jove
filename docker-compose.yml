services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: jove-gateway:local
    container_name: jove-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r=await fetch('http://localhost:3000/health');if(!r.ok)process.exit(1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
