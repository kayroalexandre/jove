services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: jove-gateway:local
    container_name: jove-gateway
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-azure}
      AZURE_AI_ENDPOINT: ${AZURE_AI_ENDPOINT:?Defina AZURE_AI_ENDPOINT no arquivo .env}
      AZURE_AI_API_KEY: ${AZURE_AI_API_KEY:?Defina AZURE_AI_API_KEY no arquivo .env}
      AZURE_AI_DEPLOYMENT_NAME: ${AZURE_AI_DEPLOYMENT_NAME:?Defina AZURE_AI_DEPLOYMENT_NAME no arquivo .env}
      AZURE_AI_DEFAULT_MODEL: ${AZURE_AI_DEFAULT_MODEL:-${AZURE_AI_DEPLOYMENT_NAME}}
      AZURE_AI_MODELS: ${AZURE_AI_MODELS:-gpt-5.6-sol,FW-GLM-5.2,gpt-5.6-luna,gpt-5.6-terra,model-router}
      AZURE_AI_API_VERSION: ${AZURE_AI_API_VERSION:-2024-10-21}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r=await fetch('http://localhost:3000/health');if(!r.ok)process.exit(1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
